<script type="text/javascript">
(function () {

    var specs = [["chat","Chat","comments","Send text or an array of messages; receive assistant content.",["temperature","max_tokens"]],["response","Generate response","comment","Send text or input items; receive combined output text.",["temperature"]],["embeddings","Create embeddings","th","Turn text into lists of numbers for finding similar text.",["dimensions"]],["image","Generate image","picture-o","Describe an image; receive image objects with URLs or encoded data.",["size","imageCount"]],["transcription","Transcribe audio","microphone","Turn an audio Buffer into written text.",["language","response_format"]],["translation","Translate audio","language","Turn an audio Buffer into translated text.",["response_format"]],["speech","Generate speech","volume-up","Turn text into an audio Buffer.",["voice","response_format","speed"]],["speakers","Identify speakers","users","Find who spoke when in an audio Buffer; receive speaker segments.",[]],["models","Models","list","List one page of models or retrieve a model by identifier.",["limit","after"]],["providers","Providers","cloud","List available Nova providers.",[]],["voices","Voices","bullhorn","List available preset voices for a speech model.",[]]];
    var aliases = {
        chat: ['chat', 'chat.completions', 'chat_completion', 'text-generation'],
        response: ['responses'], embeddings: ['embeddings', 'embedding'], image: ['images', 'image-generation', 'images.generate'],
        transcription: ['transcription', 'audio.transcriptions', 'audio:transcribe'], translation: ['translation', 'audio.translations', 'audio:translate'],
        speech: ['speech', 'tts', 'audio.speech', 'audio:synthesis'], speakers: ['diarization', 'audio.diarization']
    };
    // Unknown metadata is kept selectable: only recognized capability names justify exclusion.
    function compatible(model, kind) {
        var known = Object.keys(aliases).reduce(function (all, key) { return all.concat(aliases[key]); }, []);
        var caps = Array.isArray(model.capabilities) ? model.capabilities : [];
        return !aliases[kind] || !caps.some(function (cap) { return known.indexOf(cap) !== -1; }) || caps.some(function (cap) { return aliases[kind].indexOf(cap) !== -1; });
    }
    function discover(id, action) { return $.ajax({ url: 'nova-ai/connections/' + encodeURIComponent(id) + '/' + action, dataType: 'json', timeout: 125000 }); }
    function errorText(xhr) { return xhr.responseJSON && xhr.responseJSON.error || 'Cannot reach Nova. Check your connection and try Refresh models again.'; }
    RED.nodes.registerType('nova-connection', {
        category: 'config', defaults: { name: { value: '' }, baseUrl: { value: 'https://api.nova.datalabrotterdam.nl/v1', required: true, validate: function (v) { return /^https?:\/\/\S+$/.test(v); } }, configId: { value: '' }, timeout: { value: 120, required: true, validate: function (v) { return Number(v) > 0 && Number(v) <= 2147483; } } },
        credentials: { apiKey: { type: 'password' } },
        label: function () { return this.name || 'Nova connection'; },
        oneditprepare: function () {
            var node = this;
            $('#nova-test').on('click', function () {
                var status = $('#nova-test-status'), button = $(this);
                if (!node.id || node.changed || $('#node-config-input-apiKey').val() !== '__PWRD__' || $('#node-config-input-baseUrl').val() !== node.baseUrl || $('#node-config-input-configId').val() !== node.configId || String($('#node-config-input-timeout').val()) !== String(node.timeout)) {

            });
        },
        oneditcancel: function () { if (this._novaTest) this._novaTest.abort(); },
        oneditsave: function () { if (this._novaTest) this._novaTest.abort(); }
    });
    specs.forEach(function (spec) {
        var kind = spec[0], defaults = { name: { value: '' }, connection: { value: '', type: 'nova-connection', required: true } };
        if (kind !== 'providers') defaults.model = { value: '', required: ['models', 'voices'].indexOf(kind) === -1 };
        if (kind === 'models') defaults.operation = { value: 'list' };
        spec[4].forEach(function (key) { defaults[key] = { value: '', validate: function (value) { if (value === '' || ['temperature', 'max_tokens', 'dimensions', 'imageCount', 'speed', 'limit'].indexOf(key) === -1) return true; var n = Number(value); return Number.isFinite(n) && (key === 'temperature' ? n >= 0 : n > 0) && (['max_tokens', 'dimensions', 'imageCount', 'limit'].indexOf(key) === -1 || Number.isInteger(n)); } }; });
        RED.nodes.registerType('nova-' + kind, {
            category: 'Nova AI', color: '#B8D8E8', defaults: defaults, inputs: 1, outputs: 1,
            icon: 'font-awesome/fa-' + spec[2], paletteLabel: spec[1], label: function () { return this.name || spec[1]; },
            oneditprepare: function () {
                var node = this, generation = 0;
                $('#node-input-model').attr('list', 'nova-model-list');
                function refresh() {
                    var id = $('#node-input-connection').val(), status = $('#nova-model-status'), current = ++generation;
                    if (node._novaDiscovery) node._novaDiscovery.abort();
                    $('#nova-model-list').empty();

                    status.text('Loading models…'); $('#nova-refresh').prop('disabled', true);
                    node._novaDiscovery = discover(id, 'models').done(function (data) {
                        if (generation !== current) return;

                        }

            oneditsave: function () { if (this._novaDiscovery) this._novaDiscovery.abort(); }

<script type="text/html" data-help-name="nova-chat"><p>Send text or an array of messages; receive assistant content.</p><h3>Input</h3><p>Text or a messages array, such as [{"role":"user","content":"Hello"}].</p><h3>Output</h3><p>The useful result is in <code>msg.payload</code>. The complete response is in <code>msg.nova.response</code>, with <code>msg.nova.status</code> and <code>msg.nova.contentType</code>. Unrelated message properties are preserved.</p><p>Chat has no hidden memory. Send the complete conversation as a messages array to continue it. Tool-only replies return null; inspect the full response for tool calls.</p><h3>Example</h3><p>Inject (text: Hello) → this node → Debug. Import the examples from the Node-RED Examples menu.</p><h3>Advanced</h3><p><code>msg.nova.request</code> is an object of API options. Its fields override editor settings and fields inferred from payload (for example <code>{model: "your-model"}</code>). <code>msg.nova.configId</code> overrides connection routing. Streaming is unsupported. Failures go to Catch nodes; requests time out and are cancelled when nodes close. Requests are never automatically retried.</p></script>

<script type="text/html" data-help-name="nova-speakers"><p>Find who spoke when in an audio Buffer; receive speaker segments.</p><h3>Input</h3><p>Audio Buffer. Optional msg.filename and msg.mimetype describe the upload. File paths are never read.</p><h3>Output</h3><p>The useful result is in <code>msg.payload</code>. The complete response is in <code>msg.nova.response</code>, with <code>msg.nova.status</code> and <code>msg.nova.contentType</code>. Unrelated message properties are preserved.</p><p>Speaker identification (diarization) splits audio into segments showing who spoke when; labels do not identify people by name.</p><h3>Example</h3><p>File in (single Buffer) → this node → Debug. Set the File in path to your audio file. Import the examples from the Node-RED Examples menu.</p><h3>Advanced</h3><p><code>msg.nova.request</code> is an object of API options. Its fields override editor settings and fields inferred from payload (for example <code>{model: "your-model"}</code>). <code>msg.nova.configId</code> overrides connection routing. Streaming is unsupported. Failures go to Catch nodes; requests time out and are cancelled when nodes close. Requests are never automatically retried.</p></script>
